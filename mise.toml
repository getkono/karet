#:schema https://mise.jdx.dev/schema/mise.json

# Tools are managed by mise so `mise install` provisions everything the
# hooks and tasks below need. The Rust toolchains themselves are provided by
# rustup and pinned to exact versions in-repo: stable in rust-toolchain.toml
# (which rustup applies to every cargo call) and the rustfmt-only nightly in
# rust-nightly.txt (read below, and by hk.pkl and CI, so it has one home).
[tools]
hk = "latest"                  # git hooks manager (reads hk.pkl)
pkl = "latest"                 # config language hk.pkl is written in
"cargo:cargo-llvm-cov" = "latest"  # code coverage
"cargo:convco" = "latest"          # conventional-commit validation (commit-msg hook + CI)
"cargo:tokei" = "12.1.2"           # per-file source line enforcement (issue #81)

[tasks.format]
description = "Format code with rustfmt (pinned nightly: rustfmt.toml uses unstable import opts)"
run = 'cargo "+$(cat {{config_root}}/rust-nightly.txt)" fmt --all'

[tasks.format-check]
description = "Check formatting without writing (same pinned nightly as `format`)"
run = 'cargo "+$(cat {{config_root}}/rust-nightly.txt)" fmt --all -- --check'

[tasks.lint]
description = "Lint with clippy (deny warnings)"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Lint and auto-fix with clippy"
run = "cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged"

[tasks.file-lines]
description = "Enforce the 800-code-line ceiling for every Rust source file"
run = "cargo run --quiet --package xtask -- file-lines"

[tasks.publish-closure]
description = "Verify publishable crates depend only on versioned, publishable workspace crates"
run = "cargo run --quiet --package xtask -- publish-closure"

[tasks.publish-ready]
description = "Build unpublished .crate archives against their release-time dependency sources"
run = "cargo run --quiet --package xtask -- publish-ready"

[tasks.test]
description = "Run the test suite"
run = [
  "cargo test --workspace --all-features",
  # The real-process language-server suite. `--all-features` does not reach it:
  # `testbed` builds a process double that is a test fixture, so it is not in
  # `default`, and its tests declare `required-features`.
  "cargo test -p karet-session --features testbed --test language_server_launch",
]

[tasks.build-lean]
description = "Build without the heavy media deps (issue #23): app + karet-fileview across the optional feature combos"
run = [
  "cargo build -p karet --no-default-features",
  "cargo build -p karet --no-default-features --features pdf",
  "cargo build -p karet --no-default-features --features images",
  "cargo build -p karet --no-default-features --features docx",
  "cargo build -p karet-fileview --no-default-features",
  # `karet-fileview` gates only `raster`/`images`; PDF rasterization lives in
  # `karet-pdf` and is gated on the app, covered by the `karet` line above.
  "cargo build -p karet-fileview --no-default-features --features images",
  # `lint`/`test` run `--all-features`, so nothing else here ever compiles
  # `karet-widgets` without `markdown`. Both arms of the dialog body — the
  # plain-text one that must build with no optional features, and the
  # `DialogBody::Markdown` one — are checked explicitly.
  "cargo check -p karet-widgets --no-default-features",
  "cargo check -p karet-widgets --features markdown",
]

[tasks.coverage]
description = "Generate the CI coverage artifact and print its summary"
run = [
  "cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info",
  "cargo llvm-cov report --summary-only",
]

[tasks.verify]
description = "Run the exact quality gate shared by pre-push and CI"
run = [
  "mise run file-lines",
  "mise run publish-closure",
  "mise run publish-ready",
  "mise run format-check",
  "mise run lint",
  "mise run test",
  "mise run build-lean",
  "mise run coverage",
]

[tasks.install]
description = "Install `karet` binary to user path."
run = "cargo install --path crates/karet"

[tasks.svg]
description = "Regenerate the deterministic README hero SVG"
run = "bash scripts/gen-svg.sh"
