[package]
name        = "karet-fileview"
description = "Read-only ratatui file-view primitives — terminal images (Kitty + halfblock), hex dumps, and placeholders."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme                 = "README.md"
keywords.workspace     = true
categories.workspace   = true

[features]
default = []
# The shared terminal-image primitives (Kitty escape + dependency-free halfblock
# resampling). Enabled automatically by `images`; a consumer rarely selects it
# directly.
raster = ["dep:base64"]
# Decode & render raster image FILES through Gamut. The codec stays absent from
# raster-only consumers.
images = ["raster", "dep:gamut", "dep:thiserror"]

[dependencies]
karet-core.workspace = true
karet-filetype.workspace = true       # classify/FileKind + the Placeholder re-exports
karet-theme = { workspace = true, features = ["view"] }  # role colors for the views
ratatui.workspace = true
gamut = { workspace = true, optional = true }  # pure-Rust PNG/JPEG/WebP/TIFF decoding (behind `images`)
base64 = { workspace = true, optional = true }  # Kitty graphics protocol payload encoding (behind `raster`)
thiserror = { workspace = true, optional = true }  # ImageError (behind `images`)

[lints]
workspace = true
