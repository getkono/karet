[package]
name        = "karet-markdown"
description = "Markdown rendering model for karet TUI editors (optional ratatui renderer, optional code highlighting)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true
publish = false                       # karet-internal — not published to crates.io

[features]
default = []
# Syntax-highlight code fences via karet-syntax (a fence's info string resolves to a
# grammar through karet-treesitter's shared injection-name resolver).
highlight = ["dep:karet-syntax", "dep:karet-treesitter"]
# The markdownlint-core linter (rule engine, .markdownlint.json config, autofixes).
lint = ["dep:serde_json"]
# Render `mermaid` code fences as Unicode/ASCII diagrams in the preview.
mermaid = ["dep:merman"]
# Curated grammar bundle for typical fence languages (implies `highlight`).
lang-common = [
    "highlight",
    "karet-syntax?/lang-rust",
    "karet-syntax?/lang-python",
    "karet-syntax?/lang-javascript",
    "karet-syntax?/lang-typescript",
    "karet-syntax?/lang-json",
    "karet-syntax?/lang-go",
    "karet-syntax?/lang-c",
    "karet-syntax?/lang-cpp",
    "karet-syntax?/lang-java",
    "karet-syntax?/lang-bash",
    "karet-syntax?/lang-toml",
    "karet-syntax?/lang-html",
    "karet-syntax?/lang-css",
    "karet-syntax?/lang-yaml",
    "karet-syntax?/lang-markdown",
]
# Every grammar karet-treesitter ships (implies `highlight`).
all-languages = ["highlight", "karet-syntax?/all-languages"]
# ratatui renderer: resolves span tokens through a karet-theme Theme.
view = ["dep:ratatui", "dep:karet-theme"]

[dependencies]
serde_json = { workspace = true, optional = true }
merman = { workspace = true, optional = true }
karet-core.workspace = true
pulldown-cmark.workspace = true
thiserror.workspace = true
unicode-width.workspace = true        # wrap by terminal columns, not bytes or chars
karet-syntax = { workspace = true, optional = true }
karet-treesitter = { workspace = true, optional = true }
karet-theme = { workspace = true, optional = true, features = ["view"] }
ratatui = { workspace = true, optional = true }

[dev-dependencies]
# Compile in the Rust grammar so the code-fence highlighting tests are self-contained.
karet-treesitter = { workspace = true, features = ["lang-rust"] }

[lints]
workspace = true
