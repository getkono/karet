[package]
name        = "karet-diff"
description = "Pure text diffing engine (histogram line diff, intra-line highlights, unified-diff parse, hunk staging) for karet."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme = "README.md"
keywords.workspace     = true
categories.workspace   = true

[features]
default = []
# Derive `serde` (de)serialization on the diff model, so prepared diffs can cross
# a serialized backend seam.
serde = ["dep:serde", "karet-core/serde"]
# The optional ratatui painters for prepared diffs (unified / side-by-side lines).
# Headless consumers get zero ratatui.
view = ["dep:ratatui", "dep:unicode-width"]

[dependencies]
karet-core.workspace = true
# The shared binary sniff (`looks_binary`), so diff agrees with the explorer and
# search about which files are binary. Dependency-free.
karet-filetype.workspace = true
imara-diff.workspace = true
ratatui = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
unicode-width = { workspace = true, optional = true }

[dev-dependencies]
# Scratch files for the `diff_files` tests (binary sniffing, i/o errors).
tempfile.workspace = true
# The serialized-seam round trip of `PreparedDiff` (feature `serde`).
serde_json.workspace = true

[lints]
workspace = true
