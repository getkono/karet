[package]
name        = "karet-treesitter"
description = "Shared tree-sitter parse host (incremental parsing, tree cache, query running) for karet."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme = "README.md"
keywords.workspace     = true
categories.workspace   = true

[features]
default = []
# One feature per bundled grammar (each wires an optional grammar crate). Grammars
# are ABI 14–15, compatible with tree-sitter 0.26.9 (accepts ABI 13–15).
lang-rust       = ["dep:tree-sitter-rust"]
lang-python     = ["dep:tree-sitter-python"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-json       = ["dep:tree-sitter-json"]
lang-go         = ["dep:tree-sitter-go"]
lang-c          = ["dep:tree-sitter-c"]
lang-cpp        = ["dep:tree-sitter-cpp"]
lang-csharp     = ["dep:tree-sitter-c-sharp"]
lang-java       = ["dep:tree-sitter-java"]
lang-ruby       = ["dep:tree-sitter-ruby"]
lang-php        = ["dep:tree-sitter-php"]
lang-bash       = ["dep:tree-sitter-bash"]
lang-toml       = ["dep:tree-sitter-toml-ng"]
lang-html       = ["dep:tree-sitter-html"]
lang-css        = ["dep:tree-sitter-css"]
lang-yaml       = ["dep:tree-sitter-yaml"]
lang-markdown   = ["dep:tree-sitter-md"]
lang-latex      = ["dep:codebook-tree-sitter-latex"]
lang-zig        = ["dep:tree-sitter-zig"]
lang-xml        = ["dep:tree-sitter-xml"]
lang-svelte     = ["dep:tree-sitter-svelte-next"]
lang-astro      = ["dep:tree-sitter-astro-next"]
lang-vue        = ["dep:tree-sitter-vue-next"]
lang-sql        = ["dep:tree-sitter-sequel"]
lang-graphql    = ["dep:tree-sitter-graphql"]
lang-protobuf   = ["dep:tree-sitter-proto"]
lang-containerfile = ["dep:tree-sitter-containerfile"]
lang-make       = ["dep:tree-sitter-make"]
lang-cmake      = ["dep:tree-sitter-cmake"]
lang-rst        = ["dep:tree-sitter-rst"]
lang-asciidoc   = ["dep:tree-sitter-asciidoc"]
lang-zsh        = ["dep:tree-sitter-zsh"]
lang-fish       = ["dep:tree-sitter-fish"]
lang-powershell = ["dep:tree-sitter-powershell"]
lang-batch      = ["dep:tree-sitter-batch"]
lang-kotlin     = ["dep:tree-sitter-kotlin-ng"]
lang-swift      = ["dep:tree-sitter-swift"]
lang-scala      = ["dep:tree-sitter-scala"]
lang-lua        = ["dep:tree-sitter-lua"]
lang-haskell    = ["dep:tree-sitter-haskell"]
lang-ocaml      = ["dep:tree-sitter-ocaml"]
lang-elixir     = ["dep:tree-sitter-elixir"]
lang-erlang     = ["dep:tree-sitter-erlang"]
lang-dart       = ["dep:tree-sitter-dart"]
lang-r          = ["dep:tree-sitter-r"]
lang-perl       = ["dep:tree-sitter-perl"]
lang-clojure    = ["dep:tree-sitter-clojure-orchard"]
lang-elisp      = ["dep:tree-sitter-elisp"]
lang-vim        = ["dep:tree-sitter-vim"]
# Convenience bundle: every grammar above. The `karet` app enables this.
all-languages = [
    "lang-rust", "lang-python", "lang-javascript", "lang-typescript", "lang-json",
    "lang-go", "lang-c", "lang-cpp", "lang-csharp", "lang-java", "lang-ruby",
    "lang-php", "lang-bash", "lang-toml", "lang-html", "lang-css", "lang-yaml",
    "lang-markdown", "lang-latex", "lang-zig", "lang-xml", "lang-svelte",
    "lang-astro", "lang-vue", "lang-sql", "lang-graphql", "lang-protobuf",
    "lang-containerfile", "lang-make", "lang-cmake", "lang-rst", "lang-asciidoc",
    "lang-zsh", "lang-fish", "lang-powershell", "lang-batch",
    "lang-kotlin", "lang-swift", "lang-scala", "lang-lua", "lang-haskell",
    "lang-ocaml", "lang-elixir", "lang-erlang", "lang-dart", "lang-r",
    "lang-perl", "lang-clojure", "lang-elisp", "lang-vim",
]

[dependencies]
karet-core.workspace = true
karet-filetype.workspace = true   # shared display-name catalogue for non-grammar languages
tree-sitter.workspace = true
thiserror.workspace = true
tree-sitter-rust       = { workspace = true, optional = true }
tree-sitter-python     = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-json       = { workspace = true, optional = true }
tree-sitter-go         = { workspace = true, optional = true }
tree-sitter-c          = { workspace = true, optional = true }
tree-sitter-cpp        = { workspace = true, optional = true }
tree-sitter-c-sharp    = { workspace = true, optional = true }
tree-sitter-java       = { workspace = true, optional = true }
tree-sitter-ruby       = { workspace = true, optional = true }
tree-sitter-php        = { workspace = true, optional = true }
tree-sitter-bash       = { workspace = true, optional = true }
tree-sitter-toml-ng    = { workspace = true, optional = true }
tree-sitter-html       = { workspace = true, optional = true }
tree-sitter-css        = { workspace = true, optional = true }
tree-sitter-yaml       = { workspace = true, optional = true }
tree-sitter-md         = { workspace = true, optional = true }
codebook-tree-sitter-latex = { workspace = true, optional = true }
tree-sitter-zig        = { workspace = true, optional = true }
tree-sitter-xml        = { workspace = true, optional = true }
tree-sitter-svelte-next = { workspace = true, optional = true }
tree-sitter-astro-next = { workspace = true, optional = true }
tree-sitter-vue-next   = { workspace = true, optional = true }
tree-sitter-sequel     = { workspace = true, optional = true }
tree-sitter-graphql    = { workspace = true, optional = true }
tree-sitter-proto      = { workspace = true, optional = true }
tree-sitter-containerfile = { workspace = true, optional = true }
tree-sitter-make       = { workspace = true, optional = true }
tree-sitter-cmake      = { workspace = true, optional = true }
tree-sitter-rst        = { workspace = true, optional = true }
tree-sitter-asciidoc   = { workspace = true, optional = true }
tree-sitter-zsh        = { workspace = true, optional = true }
tree-sitter-fish       = { workspace = true, optional = true }
tree-sitter-powershell = { workspace = true, optional = true }
tree-sitter-batch      = { workspace = true, optional = true }
tree-sitter-kotlin-ng  = { workspace = true, optional = true }
tree-sitter-swift      = { workspace = true, optional = true }
tree-sitter-scala      = { workspace = true, optional = true }
tree-sitter-lua        = { workspace = true, optional = true }
tree-sitter-haskell    = { workspace = true, optional = true }
tree-sitter-ocaml      = { workspace = true, optional = true }
tree-sitter-elixir     = { workspace = true, optional = true }
tree-sitter-erlang     = { workspace = true, optional = true }
tree-sitter-dart       = { workspace = true, optional = true }
tree-sitter-r          = { workspace = true, optional = true }
tree-sitter-perl       = { workspace = true, optional = true }
tree-sitter-clojure-orchard = { workspace = true, optional = true }
tree-sitter-elisp      = { workspace = true, optional = true }
tree-sitter-vim        = { workspace = true, optional = true }

[lints]
workspace = true
