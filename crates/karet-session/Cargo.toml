[package]
name        = "karet-session"
description = "Headless editor backend for karet: owns documents and workspace, orchestrates producers, applies commands, emits events."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true
publish = false                       # karet-internal backend — pulls the whole logic tree

[features]
default = ["github", "cbor", "viz"]
# Lazily fetch a commit's "Verified" status from the GitHub REST API (the commit
# view's signature badge) and drive the GitHub dashboard. NOTE: turning this off
# does NOT drop reqwest — the managed-LSP registry uses it unconditionally.
github = ["dep:karet-github"]
# Generate a commit message from the staged diff by shelling out to the `claude`
# CLI (via aicommit-core). OFF by default — a library crate should not spawn an
# external AI CLI unless the embedder opts in; the runtime `git.aiCommit.enabled`
# setting gates it further without a rebuild.
aicommit = ["dep:aicommit-core"]
# Open/save `.cbor` documents as editable diagnostic-notation text. On by
# default; a lean embedder can drop the format plugin.
cbor = ["dep:karet-cbor"]
# The Cargo.lock package-dependency graph lens. On by default.
viz = ["dep:dependable-core"]
# Generate the settings JSON Schema (build/tooling concern — the
# settings-schema example and its freshness test; never needed at runtime).
schema = ["dep:schemars"]

[dependencies]
karet-core = { workspace = true, features = ["serde"] }   # serde-ready seam models
karet-text = { workspace = true, features = ["serde"] }
karet-filetype = { workspace = true, features = ["serde"] } # classify + serde-ready vocabulary
karet-cbor = { workspace = true, optional = true } # decode/encode CBOR ↔ editable diagnostic text (feature `cbor`)
karet-treesitter.workspace = true
karet-syntax.workspace = true
karet-lsp.workspace = true            # headless
karet-vcs = { workspace = true, features = ["serde"] }      # headless; writes use the installed git executable
blameline.workspace = true # current-buffer line blame; workspace disables language features
karet-github = { workspace = true, optional = true }    # GitHub commit-verification (feature `github`)
aicommit-core = { workspace = true, optional = true }   # AI commit-message generation (feature `aicommit`)
karet-watch.workspace = true          # centralized filesystem watching
karet-supervisor.workspace = true     # crash-safe process ownership + shared LSP broker
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "process", "time", "net", "io-util"] }
tracing.workspace = true
thiserror.workspace = true
ec4rs = { workspace = true, features = ["language-tags"] } # settings / EditorConfig + spelling_language
spellbook.workspace = true            # spell-check → diagnostics (migrated from the app)
directories.workspace = true          # server-side config / session paths
command-group.workspace = true        # crash-safe process groups / Windows Job Objects
serde = { workspace = true }          # derive Deserialize/Serialize for the Settings schema
serde_json.workspace = true           # the merge/deserialize target for JSONC config
reqwest.workspace = true              # explicitly approved managed-LSP downloads
sha2.workspace = true                 # release-asset integrity
flate2.workspace = true               # .gz / .tar.gz managed tool archives
lzma-rust2.workspace = true            # pure-Rust .tar.xz managed tool archives
tar.workspace = true                  # traversal-safe managed tool extraction
zip.workspace = true                  # Windows managed tool archives
jsonc-parser.workspace = true         # parse JSONC config files (byte-span diagnostics)
schemars = { workspace = true, optional = true }   # settings JSON Schema generation (feature `schema`)
dependable-core = { workspace = true, optional = true } # Cargo.lock → dependency graph (feature `viz`)
tempfile.workspace = true             # atomic swap-file writes + open/save flow tests

[dev-dependencies]
# Compile in the Rust + Markdown grammars so the Command/snapshot contract test can
# assert that an *injected* language really is highlighted through the worker.
karet-treesitter = { workspace = true, features = ["lang-rust", "lang-markdown"] }

[[example]]
name = "settings-schema"
required-features = ["schema"]

[lints]
workspace = true
