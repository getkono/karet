[package]
name        = "karet-seam"
description = "A queryable index of a package's seams: what is exposed, substitutable, variable, boundary-crossing, or hazardous."

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true
publish = false                       # karet-internal until the query language stabilizes

[features]
default = []
# Serialize the model, for the programmatic/agent surface. Off by default so a
# consumer that only navigates the index never compiles serde.
#
# Both directions, since the on-disk index cache reads the model back: a
# `FileContribution` is written after extraction and replayed on the next run instead of
# re-parsing an unchanged file. `FacetSubtype` still stays a `Copy` `&'static str` — it
# deserializes by resolving the name against the registered languages' subtype tables
# (see `FacetSubtype::from_name`) rather than by allocating a string per facet.
serde = ["dep:serde", "karet-core/serde"]

# Grammar pass-through to the single parse host. Only the languages this crate
# actually maps into the lens vocabulary appear here — a grammar with no facet
# mapping would parse and then classify nothing.
lang-rust       = ["karet-treesitter/lang-rust"]
lang-python     = ["karet-treesitter/lang-python"]
lang-javascript = ["karet-treesitter/lang-javascript"]
lang-typescript = ["lang-javascript", "karet-treesitter/lang-typescript"]
lang-swift      = ["karet-treesitter/lang-swift"]
lang-kotlin     = ["karet-treesitter/lang-kotlin"]

[dependencies]
karet-core.workspace       = true
karet-fuzzy.workspace      = true
karet-treesitter.workspace = true
# Manifest reading. Already a workspace dependency, and the crate that owns Cargo
# manifest parsing — so the package name comes from there rather than a second parser.
dependable-core.workspace  = true
thiserror.workspace        = true
# Packages fan out across cores, and each package's module walk is a work-stolen
# frontier — the file set cannot be enumerated up front, because Rust files are
# discovered by parsing the `mod` declarations that name them.
rayon.workspace            = true
serde = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace         = true
# The workspace integration suite indexes this repo's own crates, which needs the
# grammar and the parser pool the library only takes as an argument.
karet-treesitter.workspace = true
