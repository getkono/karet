[package]
name        = "karet-theme"
description = "Theme model and VS Code JSON theme loader with WCAG contrast checking for karet."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[features]
default = []
# Load VS Code JSON themes.
vscode = ["dep:serde", "dep:serde_json"]
# Convert resolved colors into ratatui `Style`s + WCAG contrast checking.
view = ["dep:ratatui", "dep:palette"]

[dependencies]
karet-core.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
palette = { workspace = true, optional = true }

[lints]
workspace = true
