[package]
name        = "karet-vcs"
description = "Editor-oriented git integration (status, blame, branches, staging) for karet TUI editors."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme = "README.md"
keywords.workspace     = true
categories.workspace   = true

[features]
default = ["signature"]
# Recover the signer's public key + fingerprint from an SSH commit signature (via the
# pure-Rust `ssh-key` crate). On by default; turn it off to drop the dependency, and
# signatures then report only their kind, not the signer. Extraction only — this crate
# never *verifies* a signature (see `CommitSignature`).
signature = ["dep:ssh-key"]
# Serialize/Deserialize on the public git-facts models (Branch, Commit,
# CommitDetail, FileChange, RepositoryState, …) so the backend seam that carries
# them stays wire-ready. Off by default.
serde = ["dep:serde", "karet-core/serde"]

[dependencies]
karet-core.workspace = true
serde = { workspace = true, optional = true }
gix.workspace = true
imara-diff.workspace = true
thiserror.workspace = true
ssh-key = { workspace = true, optional = true }

[lints]
workspace = true
