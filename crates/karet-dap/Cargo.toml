[package]
name        = "karet-dap"
description = "Async Debug Adapter Protocol client for karet TUI editors (breakpoints, variables, call stack)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme = "README.md"
keywords.workspace     = true
categories.workspace   = true
# Internal-but-separate: the debugger engine has no external-consumer story yet,
# so it stays unpublished until one exists.
publish = false

[features]
default = []

[dependencies]
karet-core.workspace = true
karet-jsonrpc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "net", "process", "macros", "sync", "time"] }
thiserror.workspace = true
tracing.workspace = true

# Who listens on a spawn-then-TCP adapter's port (`port_owner`); Linux reads
# `/proc` and needs neither.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
