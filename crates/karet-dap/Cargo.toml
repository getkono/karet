[package]
name        = "karet-dap"
description = "Async Debug Adapter Protocol client for karet TUI editors (breakpoints, variables, call stack)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme = "README.md"
keywords.workspace     = true
categories.workspace   = true
# Unimplemented skeleton kept as the future DAP client's landing spot; nothing may
# publish or depend on it until the debugger UI exists.
publish = false

[features]
default = []

[dependencies]
karet-core.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "process", "macros", "sync"] }
thiserror.workspace = true
# TODO: DAP protocol types — hand-roll over serde, or adopt the `dap` crate once it is past alpha.

[lints]
workspace = true
