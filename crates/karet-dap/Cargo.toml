[package]
name        = "karet-dap"
description = "Async Debug Adapter Protocol client for karet TUI editors (breakpoints, variables, call stack)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme = "README.md"
keywords.workspace     = true
categories.workspace   = true
# Internal-but-separate: the debugger engine has no external-consumer story yet,
# so it stays unpublished until one exists.
publish = false

[features]
default = []

[dependencies]
karet-lsp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "net", "process", "macros", "sync", "time"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
