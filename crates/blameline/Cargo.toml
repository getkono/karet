[package]
name        = "blameline"
description  = "Semantic git blame: grouped, full-message, tree-sitter-filtered blame with structured (JSON) output"
# INDEPENDENT versioning — blameline is a standalone library and is deliberately NOT
# pinned to the karet workspace's lockstep `version.workspace`. It follows its own
# SemVer line starting at 1.0.0 and releases on its own cadence. See `README.md`.
version      = "2.0.2"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme       = "README.md"
keywords     = ["git", "blame", "tree-sitter", "vcs"]
categories   = ["development-tools", "command-line-utilities"]
# (no `publish = false`: this is a published, externally-reusable library)

[dependencies]
# gix's `blame` feature is trimmed from the workspace default for weight; blameline
# opts back into it (feature unification re-enables the gix blame module workspace-wide).
gix              = { workspace = true, features = ["blame"] }
karet-treesitter = { workspace = true, optional = true } # shared parse host (function narrowing)
serde            = { workspace = true }    # derive(Serialize/Deserialize) on the output models
serde_json       = { workspace = true }    # `to_json` convenience helper
thiserror        = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# The default build is gix-only pure Rust: grouped whole-file blame with no C
# compiler required. Function narrowing (tree-sitter, vendored C via `cc`) is
# opt-in behind `treesitter` + the `lang-*` grammar set a consumer wants;
# without it `blame_function` degrades to whole-file blame.
default = []
treesitter      = ["dep:karet-treesitter"]
lang-rust       = ["treesitter", "karet-treesitter/lang-rust"]
lang-python     = ["treesitter", "karet-treesitter/lang-python"]
lang-javascript = ["treesitter", "karet-treesitter/lang-javascript"]
lang-typescript = ["treesitter", "karet-treesitter/lang-typescript"]
lang-go         = ["treesitter", "karet-treesitter/lang-go"]
lang-c          = ["treesitter", "karet-treesitter/lang-c"]
lang-cpp        = ["treesitter", "karet-treesitter/lang-cpp"]
lang-java       = ["treesitter", "karet-treesitter/lang-java"]
lang-ruby       = ["treesitter", "karet-treesitter/lang-ruby"]
lang-csharp     = ["treesitter", "karet-treesitter/lang-csharp"]
lang-php        = ["treesitter", "karet-treesitter/lang-php"]
lang-bash       = ["treesitter", "karet-treesitter/lang-bash"]
# Every language the function filter has a bundled query for. Deliberately NOT
# named `all-languages`: karet-treesitter's bundle of that name covers its full
# grammar catalogue, while this one covers only the narrowing queries above.
all-narrowing-languages = [
    "lang-rust", "lang-python", "lang-javascript", "lang-typescript", "lang-go",
    "lang-c", "lang-cpp", "lang-java", "lang-ruby", "lang-csharp", "lang-php", "lang-bash",
]

[lints]
workspace = true
