[package]
name        = "karet-widgets"
description = "Reusable ratatui widget toolkit for editors (file tree, picker, palette, status bar, dialogs, panes, …)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true
publish = false                       # karet-internal UI toolkit — not published to crates.io

[features]
default = []
# Markdown rendering (and, transitively, the tree-sitter stack for fence
# highlighting). Off by default so consumers of the plain widgets never pay for
# it: the dialog's body wraps as plain text without it, and only gains
# `DialogBody::Markdown` with it.
markdown = ["dep:karet-markdown"]
# The LSP hover/doc popup, whose markup is rendered as markdown.
hover = ["markdown"]

[dependencies]
karet-core.workspace = true
karet-filetype.workspace = true       # file-type icons for the file tree/glyphs
karet-fuzzy.workspace = true
karet-markdown = { workspace = true, features = ["view", "highlight"], optional = true }
karet-theme = { workspace = true, features = ["view"] }  # role colors for the widgets
ratatui.workspace = true
ignore.workspace = true
unicode-width.workspace = true

[lints]
workspace = true
