name: Feature Request
description: Suggest an improvement or new capability
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Check [`docs/scope.md`](https://github.com/getkono/karet/blob/master/docs/scope.md)
        first — some capabilities are deliberate non-goals. Proposing one anyway is
        fine; bring evidence of demand.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this address? Include the use case and who it affects.
      placeholder: Describe the problem, limitation, or opportunity.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like karet to do?
      placeholder: Describe the behavior or outcome you would like.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Share any alternatives, examples, mockups, or related links.
    validations:
      required: false
