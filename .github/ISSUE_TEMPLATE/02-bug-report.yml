name: Bug Report
description: Report something that is not working correctly
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence you know. If the problem is intermittent, say so.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: karet-version
    attributes:
      label: karet -V output
      description: |
        Paste the full output of `karet -V`. It names the exact commit the binary was
        built from, which is needed to reproduce the problem. If the problem is in a
        library crate rather than the `karet` app, give the crate version and the commit
        you depend on instead.
      placeholder: |
        karet X.Y.Z
        commit:  <short sha>[ (dirty)] (<commit time>)
        profile: ...
        rustc:   ...
        built:   ...
      render: text
    validations:
      required: true

  - type: textarea
    id: relevant-context
    attributes:
      label: Relevant environment or context
      description: Include anything that may help diagnose the problem.
      placeholder: OS, terminal, configuration, logs, screenshots, or related links
    validations:
      required: false
