name: CI

on:
  push:
    branches: [master]
  # Stacked pull requests target another feature branch until their parent merges.
  # Run the same checks for those bases instead of waiting for a retarget to master.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validate that every commit in a PR follows Conventional Commits. convco
  # skips merge commits by default, so conflict-resolution merges don't trip it.
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: convco
      - name: Check PR commits
        run: >-
          convco check --ignore-reverts
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  check:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install mise as the shared task runner, but keep tool provisioning in the
      # explicit steps below so CI does not install hook-only development tools.
      - uses: jdx/mise-action@v3
        with:
          version: 2026.7.4
          install: false
      # Both toolchains are pinned in-repo, so CI and local dev compile with the
      # exact same rustc. Formatting runs on the nightly pinned in rust-nightly.txt
      # (rustfmt.toml uses unstable import options for merge resilience); build,
      # clippy and tests run on the stable toolchain pinned in rust-toolchain.toml,
      # which the bare `rustup toolchain install` resolves (along with its
      # components) and which rustup then applies to every unprefixed cargo call.
      - name: Install pinned toolchains
        run: |
          rustup toolchain install --profile minimal --component rustfmt "$(cat rust-nightly.txt)"
          rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei@12.1.2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Verify workspace
        run: mise run verify
      # The all-features workspace build above never exercises the lean grammar
      # configurations, so check the feature seams a downstream consumer would
      # actually use: the parse host with no grammars, with exactly one, the
      # syntax pass-through bundle, and markdown's curated fence bundle.
      - name: Check feature subsets
        run: |
          cargo check -p karet-treesitter --no-default-features
          cargo check -p karet-treesitter --no-default-features --features lang-rust
          cargo check -p karet-syntax --features all-languages
          cargo check -p karet-markdown --features lang-common
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
